<!doctype html>
<html>

<head>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #cam {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #ctl {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 5px;
            background: #222c;
            border-radius: 8px;
        }

        a {
            display: block;
            padding: 10px;
            margin: 5px;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
        }

        .on {
            background: #198754;
        }

        .off {
            background: #dc3545;
        }
    </style>
</head>

<body>
    <img id="cam" src="http://192.168.0.6/dev/080c00049CA2/live" />
    <div id="ctl">
        <a class="on" href="http://192.168.0.6/dev/080c00049CA2/irOn" onclick="ir(event, this.href)">IR On</a>
        <a class="off" href="http://192.168.0.6/dev/080c00049CA2/irOff" onclick="ir(event, this.href)">IR Off</a>
    </div>
    <script>
        function ir(e, u) {
            e.preventDefault();
            new Image().src = u;
        }
    </script>
</body>

</html>
